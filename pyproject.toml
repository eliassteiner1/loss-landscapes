[project]
name = "loss-landscapes"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Elias Steiner", email = "steineel@student.ethz.ch" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "torch>=2.15.0",
]

[project.scripts]
loss-landscapes = "loss_landscapes:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu134"
url = "https://download.pytorch.org/whl/cu134"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu134" }
torchvision = { index = "pytorch-cu134" }
