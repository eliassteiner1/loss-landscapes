# ==============================================================================
# PACKAGE DEFINITION (standard, understood by any Python tool)
#   [project]      -> package metadata + runtime dependencies
#   [build-system] -> backend that turns src/ into an installable package.
#                     Its presence is what makes uv install this project
#                     (editable) into .venv, so `import loss_landscapes`
#                     works from scripts/, notebooks/ and tests/.
# ==============================================================================

[project]
name = "loss-landscapes"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Elias Steiner", email = "elias.steiner@gmx.ch" }
]
requires-python = ">=3.14"
dependencies = [
    "h5py>=3.16.0",
    "ipywidgets>=8.1.9",
    "numpy>=2.5.4",
    "plotly>=7.1.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
    "trackio>=0.45.0",
    "tyro>=1.0.17",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"] # backend package; keep range in step with `uv --version`
build-backend = "uv_build"            # backend module uv calls to build/install the project



# ==============================================================================
# DEVELOPMENT ONLY (uv-specific)
# Nothing below becomes package metadata: dependency groups and [tool.uv]
# settings only affect the local dev environment and uv.lock.
#
# Torch build selection (torch + torchvision, chosen per machine):
#   uv sync                  -> PyPI builds (CPU on Windows/macOS, CUDA on Linux)
#   uv sync --group cpu      -> CPU-only builds from the PyTorch index
#   uv sync --group cu134    -> CUDA 13.4 builds from the PyTorch index
#
# uv does NOT remember the chosen group: every command that syncs
# (uv sync / uv run / uv remove) needs the --group flag again, otherwise
# torch is switched back to the PyPI build.
#
# uv add is special: there --group means "add the package TO that group",
# not "sync with it". To add a runtime dependency without losing the variant:
#   uv add <pkg> --no-sync
#   uv sync --group <cpu|cu134>
# ==============================================================================

# CUSTOM INDICES: package registries other than PyPI
# ------------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true # only used for packages that explicitly point here via sources

[[tool.uv.index]]
name = "pytorch-cu134"
url = "https://download.pytorch.org/whl/cu134"
explicit = true # only used for packages that explicitly point here via sources

# SOURCES: where uv fetches a package from, if not PyPI.
# Here scoped per group: the index is only used when that group is active.
# ------------------------------------------------------------------------------
[tool.uv.sources]
torch = [
  { index = "pytorch-cpu",   group = "cpu" },
  { index = "pytorch-cu134", group = "cu134" },
]
torchvision = [
  { index = "pytorch-cpu",   group = "cpu" },
  { index = "pytorch-cu134", group = "cu134" },
]

# DEPENDENCY GROUPS: dev-only package sets.
# "dev" is installed by default with uv sync; all other groups are opt-in
# via uv sync --group <name>.
# cpu / cu134 add no new packages (torch + torchvision are already runtime
# deps); they only act as switches that activate the matching sources above.
# ------------------------------------------------------------------------------
[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
]
cpu = [         # torch build variant, see sources above
    "torch",
    "torchvision",
]
cu134 = [       # torch build variant, see sources above
    "torch",
    "torchvision",
]

# UV SETTINGS
# conflicts: cpu and cu134 can never be installed together. uv resolves each
# variant separately and stores all of them in uv.lock.
# ------------------------------------------------------------------------------
[tool.uv]
conflicts = [[{group = "cpu"}, {group = "cu134"}]]
